[package]
name = "mozaik"
version = "0.12.0"
description = "An offline, tiled desktop workspace"
authors = ["Bahadır Maktav"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mozaik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
tempfile = "3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
fs2 = "0.4"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
# Default features: chrono writes the freedesktop DeletionDate that Trash UIs expect.
trash = "5.2.9"
# ShellExecuteExW instead of a PowerShell/cmd launcher: the path is never shell-interpolated.
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
ignore = "0.4"
regex = "1"
# SonarQube requests only (`sonar.rs`): the OS's TLS and certificate store (SChannel on
# Windows, OpenSSL on Linux), so a company CA the system trusts works; the system proxy too.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The SonarQube token in the Secret Service, through zbus (no C library).
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell"] }
# The SonarQube token in the Windows Credential Manager.
keyring = { version = "3", features = ["windows-native"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
