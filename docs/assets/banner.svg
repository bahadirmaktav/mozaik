<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Mozaik: an offline desktop workspace you tile yourself">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa196"/>
      <stop offset="1" stop-color="#36534b"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcd6cd"/>
      <stop offset="1" stop-color="#6c9387"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d0d2"/>
      <stop offset="1" stop-color="#7a878b"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dbb4"/>
      <stop offset="1" stop-color="#cd9c5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#94b5ab" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#94b5ab" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ca"><rect x="4" y="4" width="35" height="35" rx="8"/></clipPath>
    <clipPath id="cb"><rect x="41.5" y="4" width="18.5" height="35" rx="7"/></clipPath>
    <clipPath id="cc"><rect x="4" y="41.5" width="35" height="18.5" rx="7"/></clipPath>
    <clipPath id="cd"><rect x="41.5" y="41.5" width="18.5" height="18.5" rx="6"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#111316"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow)"/>

  <!-- The Mozaik mark (public/mozaik.svg), scaled. -->
  <g transform="translate(60 106) scale(3.25)">
    <rect x="4" y="4" width="35" height="35" rx="8" fill="url(#a)"/>
    <rect x="41.5" y="4" width="18.5" height="35" rx="7" fill="url(#b)"/>
    <rect x="4" y="41.5" width="35" height="18.5" rx="7" fill="url(#c)"/>
    <rect x="41.5" y="41.5" width="18.5" height="18.5" rx="6" fill="url(#d)"/>
    <g fill="#0b1210" opacity="0.18">
      <ellipse cx="46" cy="58" rx="40" ry="24" clip-path="url(#ca)"/>
      <ellipse cx="68" cy="34" rx="22" ry="20" clip-path="url(#cb)"/>
      <ellipse cx="30" cy="80" rx="40" ry="26" clip-path="url(#cc)"/>
      <ellipse cx="68" cy="68" rx="20" ry="16" clip-path="url(#cd)"/>
    </g>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="290" y="200" font-size="84" font-weight="600" fill="#dce0e6" letter-spacing="-1">Mozaik</text>
    <text x="294" y="250" font-size="25" fill="#929ba8">An offline desktop workspace you tile yourself.</text>
    <text x="294" y="290" font-size="16" fill="#94b5ab">Editor · Terminal · Files · Tasks · Notes · Excalidraw · Mermaid · C++ IDE</text>
  </g>

  <!-- A small tiled workspace. -->
  <g transform="translate(900 70)">
    <rect x="0" y="0" width="250" height="280" rx="14" fill="#1a1d22" stroke="#30363f"/>
    <rect x="10" y="10" width="140" height="160" rx="8" fill="#16191e" stroke="#30363f"/>
    <g stroke-linecap="round" stroke-width="5">
      <line x1="24" y1="32" x2="70" y2="32" stroke="#94b5ab"/>
      <line x1="78" y1="32" x2="120" y2="32" stroke="#dce0e6" stroke-opacity="0.5"/>
      <line x1="36" y1="50" x2="100" y2="50" stroke="#e2b77e"/>
      <line x1="36" y1="68" x2="130" y2="68" stroke="#dce0e6" stroke-opacity="0.5"/>
      <line x1="36" y1="86" x2="86" y2="86" stroke="#94b5ab"/>
      <line x1="24" y1="104" x2="44" y2="104" stroke="#dce0e6" stroke-opacity="0.5"/>
      <line x1="24" y1="128" x2="60" y2="128" stroke="#929ba8" stroke-opacity="0.6"/>
      <line x1="24" y1="146" x2="104" y2="146" stroke="#929ba8" stroke-opacity="0.6"/>
    </g>
    <rect x="158" y="10" width="82" height="76" rx="8" fill="#16191e" stroke="#30363f"/>
    <g fill="none" stroke="#bcd6cd" stroke-width="2.5">
      <rect x="172" y="24" width="22" height="14" rx="3"/>
      <rect x="206" y="56" width="22" height="14" rx="3"/>
      <path d="M194 31 C210 31 206 46 217 56"/>
    </g>
    <rect x="158" y="94" width="82" height="76" rx="8" fill="#16191e" stroke="#30363f"/>
    <g stroke-linecap="round" stroke-width="4">
      <rect x="170" y="110" width="9" height="9" rx="2" fill="none" stroke="#9ccc9c" stroke-width="2.5"/>
      <line x1="188" y1="115" x2="226" y2="115" stroke="#dce0e6" stroke-opacity="0.5"/>
      <rect x="170" y="128" width="9" height="9" rx="2" fill="none" stroke="#929ba8" stroke-width="2.5"/>
      <line x1="188" y1="133" x2="218" y2="133" stroke="#dce0e6" stroke-opacity="0.5"/>
      <rect x="170" y="146" width="9" height="9" rx="2" fill="none" stroke="#929ba8" stroke-width="2.5"/>
      <line x1="188" y1="151" x2="222" y2="151" stroke="#dce0e6" stroke-opacity="0.5"/>
    </g>
    <rect x="10" y="178" width="230" height="92" rx="8" fill="#16191e" stroke="#30363f"/>
    <g font-family="Consolas, 'Liberation Mono', monospace" font-size="15">
      <text x="24" y="206" fill="#94b5ab">$ <tspan fill="#dce0e6">cmake --build build</tspan></text>
      <text x="24" y="230" fill="#929ba8">[100%] Built target app</text>
      <text x="24" y="254" fill="#9ccc9c">$ <tspan fill="#dce0e6">▍</tspan></text>
    </g>
  </g>
</svg>
