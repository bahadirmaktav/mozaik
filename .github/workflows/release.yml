name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check branch, version and existing releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main only, not $GITHUB_REF."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d '"' -f 2)
          if [ "$version" != "$conf" ] || [ "$version" != "$cargo" ]; then
            echo "::error::Versions differ: package.json $version, tauri.conf.json $conf, Cargo.toml $cargo."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::A release or draft named v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
  windows:
    needs: [version, checks]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run package:windows -- -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/Mozaik_${{ env.VERSION }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 7
  # Built and its Rust tests run on Linux, but not tried on a Linux desktop by this workflow. Its
  # failure leaves the Linux packages out of the draft, not the Windows installer. Ubuntu 22.04
  # keeps the AppImage's glibc old enough for most current distributions.
  linux:
    needs: [version, checks]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential file patchelf libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev librsvg2-dev
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles deb,appimage -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/Mozaik_${{ env.VERSION }}_amd64.deb
            src-tauri/target/release/bundle/appimage/Mozaik_${{ env.VERSION }}_amd64.AppImage
          if-no-files-found: error
          retention-days: 7
  # The only job that may write: it publishes nothing, it creates a draft from the packages.
  draft:
    needs: [version, windows, linux]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LINUX: ${{ needs.linux.result }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create draft release
        working-directory: packages
        run: |
          notes="Windows 10/11 x64 installer. It needs Microsoft Edge WebView2, which Windows 11 includes; the installer does not install it. The installer is not code-signed, so Windows SmartScreen may warn before it runs."
          if [ "$LINUX" = "success" ]; then
            notes="$notes

          Linux x64 .deb and AppImage (WebKitGTK 4.1, Wayland). They are built and their Rust tests pass on Ubuntu 22.04, but they have not been tried on a Linux desktop yet: expect rough edges."
          else
            echo "::warning::The Linux build did not succeed ($LINUX); the draft has the Windows installer only."
          fi
          notes="$notes

          Each file's SHA-256 checksum is attached."
          # An artifact of several files keeps their folders (deb/, appimage/): bring them up.
          find . -mindepth 2 -type f -name 'Mozaik_*' -exec mv -t . {} +
          expected=("Mozaik_${VERSION}_x64-setup.exe")
          if [ "$LINUX" = "success" ]; then
            expected+=("Mozaik_${VERSION}_amd64.deb" "Mozaik_${VERSION}_amd64.AppImage")
          fi
          for file in "${expected[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing from the downloaded packages."
              exit 1
            fi
          done
          files=()
          for file in "${expected[@]}"; do
            sha256sum "$file" > "$file.sha256"
            cat "$file.sha256"
            files+=("$file" "$file.sha256")
          done
          gh release create "v$VERSION" "${files[@]}" \
            --draft --target "$GITHUB_SHA" --title "Mozaik $VERSION" --notes "$notes"
