name: Validate
on:
  push:
  pull_request:
  workflow_call:
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # Linux's browser tests were checked on Ubuntu 24.04 (WSL) for v0.13.0.
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential file patchelf libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev librsvg2-dev
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Browser prerequisites
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:production
      - name: Keep Playwright results of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
